# E2E fuer M7: Katalogpflege.
#
# Produkt loeschen -> der Listeneintrag bleibt (ADR-007) -> Katalog
# zuruecksetzen bringt es zurueck -> eigenes Produkt anlegen, umbenennen,
# Kategorie aendern -> doppelter Name wird abgelehnt
# (FR-4.2, FR-4.3, FR-4.4).
#
# Laeuft gegen einen Release-Build (ADR-025): npm run android:release
appId: de.toshopping.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'add-input'
    timeout: 30000

# Ein mitgeliefertes Produkt auf die Liste setzen
- tapOn:
    id: 'add-input'
- inputText: 'Hafermilch'
- extendedWaitUntil:
    visible:
      id: 'suggestion-Hafermilch'
    timeout: 30000
- tapOn:
    id: 'suggestion-Hafermilch'
- extendedWaitUntil:
    visible:
      id: 'item-Hafermilch'
    timeout: 30000
- hideKeyboard
- waitForAnimationToEnd

# --- Produkt loeschen (T-7.3) ---
- tapOn:
    id: 'back-to-lists'
# Katalogpflege liegt seit M9 im Menue der Uebersicht - vier Symbole
# nebeneinander waeren fuer die Zielgruppe vier Raetsel gewesen.
- extendedWaitUntil:
    visible:
      id: 'lists-menu'
    timeout: 15000
- tapOn:
    id: 'lists-menu'
- extendedWaitUntil:
    visible:
      id: 'open-products'
    timeout: 15000
- tapOn:
    id: 'open-products'
- extendedWaitUntil:
    visible:
      id: 'products-search'
    timeout: 15000
- tapOn:
    id: 'products-search'
- inputText: 'Hafermilch'
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'product-Hafermilch'
    timeout: 15000
- tapOn:
    id: 'product-more-Hafermilch'
- extendedWaitUntil:
    visible:
      id: 'product-delete'
    timeout: 15000
- tapOn:
    id: 'product-delete'
- extendedWaitUntil:
    visible:
      id: 'product-delete-confirm'
    timeout: 15000
- tapOn:
    id: 'product-delete-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'product-Hafermilch'
    timeout: 15000

# Der Listeneintrag steht weiter da - er traegt den Namen als Kopie (ADR-007).
# Das ist die Zusage, die im Laden zaehlt: Aufraeumen im Katalog nimmt
# niemandem den Zettel weg.
- back
- extendedWaitUntil:
    visible:
      id: 'list-Einkauf'
    timeout: 15000
- tapOn:
    id: 'list-Einkauf'
- extendedWaitUntil:
    visible:
      id: 'item-Hafermilch'
    timeout: 15000

# --- Katalog zuruecksetzen (T-7.4) ---
- tapOn:
    id: 'back-to-lists'
# Katalogpflege liegt seit M9 im Menue der Uebersicht - vier Symbole
# nebeneinander waeren fuer die Zielgruppe vier Raetsel gewesen.
- extendedWaitUntil:
    visible:
      id: 'lists-menu'
    timeout: 15000
- tapOn:
    id: 'lists-menu'
- extendedWaitUntil:
    visible:
      id: 'open-products'
    timeout: 15000
- tapOn:
    id: 'open-products'
- extendedWaitUntil:
    visible:
      id: 'catalog-reset'
    timeout: 15000
- tapOn:
    id: 'catalog-reset'
- extendedWaitUntil:
    visible:
      id: 'catalog-reset-confirm'
    timeout: 15000
- tapOn:
    id: 'catalog-reset-confirm'

# Das geloeschte mitgelieferte Produkt ist zurueck
- tapOn:
    id: 'products-search'
- inputText: 'Hafermilch'
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'product-Hafermilch'
    timeout: 15000

# --- Eigenes Produkt anlegen (T-7.2) ---
# Das Suchfeld leeren, sonst uebernimmt der Entwurf den Suchtext als Namen.
#
# Bewusst ueber das X der Suchleiste und nicht ueber "eraseText: 20": Letzteres
# schickt eine gezaehlte Zahl Ruecktasten, und ueber eine langsamere Verbindung
# kommen nicht alle an. Genau daran ist dieser Flow gescheitert - aus
# "Hafermilch" wurde "Hafe", der Entwurf uebernahm es, und das Produkt hiess am
# Ende "HafeKokoswasser". Ein Tipp auf das X hat dagegen genau eine Wirkung.
#
# Zur Tastatur danach - dreimal falsch gemacht, deshalb ausfuehrlich:
#
# Papers X leert das Feld und behaelt manchmal den Fokus, dann springt die
# Tastatur auf und verdeckt den Knopf "Neues Produkt". Manchmal auch nicht.
# "hideKeyboard" ist fuer diesen Wechsel die falsche Wahl: Findet es keine
# Tastatur, faellt es auf die Zuruecktaste zurueck - und die verlaesst den
# Screen. Zweimal ist der Flow so auf "Meine Listen" gelandet, einmal blieb er
# hinter der Tastatur haengen. Ein Wartepunkt davor half nicht.
#
# Ein Tipp auf die Abteilungsueberschrift ist dagegen in **beiden** Zustaenden
# harmlos: Sie ist nur Text, kein Bedienelement, also passiert bei geschlossener
# Tastatur nichts. Ist sie offen, geht der Tipp an die Liste, und die schliesst
# sie (keyboardShouldPersistTaps="handled" in ProductsScreen.tsx).
- tapOn:
    id: 'products-search-clear-icon'
- waitForAnimationToEnd
- tapOn: 'Obst & Gemüse'
- waitForAnimationToEnd
# Beweisen, dass das Feld wirklich leer ist - sonst faellt der Flow erst
# zwanzig Schritte spaeter durch, mit einem Produktnamen, den niemand erklaeren
# kann.
#
# Nicht ueber das X selbst: Paper laesst das immer im Baum stehen und macht es
# nur durchsichtig (Searchbar.tsx, "Clear icon should be always rendered").
# Geprueft wird deshalb die Wirkung - ohne Filter steht der ganze Katalog
# wieder da, und "Ananas" ist der erste Eintrag der ersten Abteilung.
- extendedWaitUntil:
    visible:
      id: 'product-Ananas'
    timeout: 15000
# Und der Knopf muss auch wirklich frei liegen, nicht hinter der Tastatur.
- extendedWaitUntil:
    visible:
      id: 'product-create'
    timeout: 15000
- tapOn:
    id: 'product-create'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 15000
- tapOn:
    id: 'product-name'
- inputText: 'Kokoswasser'
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: 'product-save'
- extendedWaitUntil:
    visible:
      id: 'products-search'
    timeout: 15000

# --- Umbenennen und Kategorie aendern ---
- tapOn:
    id: 'products-search'
- inputText: 'Kokoswasser'
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'product-Kokoswasser'
    timeout: 15000
- tapOn:
    id: 'product-Kokoswasser'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 15000
- tapOn:
    id: 'product-name'
- eraseText: 20
- inputText: 'Kokosdrink'
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: 'category-Kühlregal'
- tapOn:
    id: 'product-save'

# Der neue Name steht unter der neuen Kategorie
- tapOn:
    id: 'products-search'
- eraseText: 20
- inputText: 'Kokosdrink'
- hideKeyboard
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'product-Kokosdrink'
    timeout: 15000
- assertVisible: 'Kühlregal'

# --- Doppelter Name wird abgelehnt (T-7.2) ---
- tapOn:
    id: 'product-Kokosdrink'
- extendedWaitUntil:
    visible:
      id: 'product-name'
    timeout: 15000
- tapOn:
    id: 'product-name'
- eraseText: 20
- inputText: 'Milch'
- hideKeyboard
- waitForAnimationToEnd
# Der Knopf sperrt sich, solange der Name vergeben ist - der Hinweis steht
# darueber im Feld.
- assertVisible:
    id: 'product-save'
    enabled: false
