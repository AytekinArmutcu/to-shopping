# E2E-Smoke-Test: Startet die App und prueft, dass der Haupt-Screen steht.
#
# Laeuft gegen einen Release-Build mit eingebettetem JavaScript (ADR-025),
# nicht gegen den Entwicklungsserver:  npm run android:release
#
# Wird in M3 auf den vollstaendigen Hauptweg erweitert:
# hinzufuegen -> abhaken -> Einkauf abschliessen (T-12.4).
appId: de.toshopping.app
---
# clearState ist hier wieder moeglich, weil der Release-Build sein JavaScript
# eingebettet hat: Es wird nur die Datenbank geleert, kein Bundle nachgeladen.
# Die App legt Kategorien und Startkatalog beim naechsten Start neu an.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'item-list'
    timeout: 30000
# Das Eingabefeld ist der Kern des Haupt-Flows (PRD Flow 1.3).
- assertVisible:
    id: 'add-input'
- assertVisible: 'Artikel hinzufügen'
