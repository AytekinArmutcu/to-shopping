# E2E fuer M16: Zubereitungsschritte und Grundvorrat (T-16.6, ADR-047).
#
# Der Grundstock bringt Schritte mit: Pfannkuchen hat fuenf
# (src/db/seed/recipes.json), der erste beginnt mit "Mehl, Milch, Eier".
# Ein neuer Schritt wird angehaengt, eine Stelle nach oben geschoben,
# gespeichert - und steht dann an vorletzter Stelle. Danach wird er wieder
# geloescht.
#
# Zweiter Teil: der Grundvorrat. Pfannkuchen hat sieben Zutaten, drei davon
# sind Grundvorrat (Mehl, Salz, Vanillezucker - products.json, "staple": true).
# Nichts liegt im Vorrat, also fehlen vier. Wird Salz im Katalog als
# Grundvorrat abgewaehlt, fehlt es wieder mit: fuenf. Das ist die Zusage aus
# ADR-047 - das Kennzeichen sitzt am Produkt und wirkt in jedem Rezept.
#
# Die Schritte stehen in der Ansicht als eine zugaengliche Zeile mit dem
# Label "Schritt n: Text" (RecipeScreen.tsx, recipe.stepLabel). Maestro
# vergleicht text auch mit diesem Label - darum pruefen die Zusicherungen
# id und vollen Labeltext zusammen: Nummer und Inhalt an einer Stelle.
#
# Die Schritte stehen unter sieben Zutaten, also unterhalb des Bildschirms:
# scrollUntilVisible statt eines blossen Wartens.
#
# Kein hideKeyboard ohne sicher offene Tastatur (faellt sonst auf Zurueck
# zurueck und verlaesst den Screen), kein eraseText zum Leeren, keine
# Umlaute in inputText.
#
# Laeuft gegen einen Release-Build (ADR-025): npm run android:release
appId: de.toshopping.app
---
# --- Erster Start, Pfannkuchen oeffnen ---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'add-input'
    timeout: 60000
- tapOn:
    id: 'back-to-lists'
- extendedWaitUntil:
    visible:
      id: 'list-Einkauf'
    timeout: 15000
- tapOn:
    id: 'lists-menu'
- extendedWaitUntil:
    visible:
      id: 'open-recipes'
    timeout: 15000
- tapOn:
    id: 'open-recipes'
- extendedWaitUntil:
    visible:
      id: 'recipes-list'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'recipe-Pfannkuchen'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'recipe-Pfannkuchen'
- extendedWaitUntil:
    visible:
      id: 'ingredient-Mehl'
    timeout: 15000

# Sieben Zutaten, drei Grundvorrat, nichts im Vorrat: vier fehlen.
- assertVisible:
    id: 'recipe-missing'
    text: '4 fehlen'

# --- Die mitgelieferten Schritte sind lesbar ---
- scrollUntilVisible:
    element:
      id: 'step-0'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'step-0'
    text: 'Schritt 1: Mehl, Milch, Eier, eine Prise Salz und Vanillezucker zu einem glatten Teig verrühren.'

# --- Schritt anhaengen und eine Stelle nach oben schieben ---
- tapOn:
    id: 'recipe-edit'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'step-add'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'step-add'
# Fuenf Schritte (0-4), der neue bekommt Index 5.
- extendedWaitUntil:
    visible:
      id: 'step-input-5'
    timeout: 15000
- tapOn:
    id: 'step-input-5'
- inputText: 'Danach mit Zucker bestreuen'
- tapOn:
    id: 'step-up-5'
- waitForAnimationToEnd
- tapOn:
    id: 'recipe-save'
- extendedWaitUntil:
    visible:
      id: 'recipe-edit'
    timeout: 15000

# Jetzt an vorletzter Stelle: Schritt 5 von 6, dahinter der alte letzte.
- scrollUntilVisible:
    element:
      id: 'step-5'
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: 'step-4'
    text: 'Schritt 5: Danach mit Zucker bestreuen'
- assertVisible:
    id: 'step-5'
    text: 'Schritt 6: Mit Marmelade bestreichen und aufrollen.'

# --- Schritt wieder loeschen ---
- tapOn:
    id: 'recipe-edit'
- extendedWaitUntil:
    visible:
      id: 'recipe-name'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'step-remove-4'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'step-remove-4'
- tapOn:
    id: 'recipe-save'
- extendedWaitUntil:
    visible:
      id: 'recipe-edit'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'step-4'
    direction: DOWN
    timeout: 30000
# Wieder fuenf Schritte, der letzte ist wieder der Marmeladen-Schritt.
- assertVisible:
    id: 'step-4'
    text: 'Schritt 5: Mit Marmelade bestreichen und aufrollen.'
- assertNotVisible:
    id: 'step-5'
- assertNotVisible:
    text: '.*Danach mit Zucker bestreuen.*'

# --- Grundvorrat umschalten: Salz ist ab jetzt keiner mehr ---
- tapOn:
    id: 'recipe-back'
- extendedWaitUntil:
    visible:
      id: 'recipes-list'
    timeout: 15000
- tapOn:
    id: 'recipes-back'
- extendedWaitUntil:
    visible:
      id: 'list-Einkauf'
    timeout: 15000
- tapOn:
    id: 'lists-menu'
- extendedWaitUntil:
    visible:
      id: 'open-products'
    timeout: 15000
- tapOn:
    id: 'open-products'
- extendedWaitUntil:
    visible:
      id: 'products-search'
    timeout: 15000
- tapOn:
    id: 'products-search'
- inputText: 'Salz'
# Die Tastatur muss vor dem Dialog weg: Bleibt sie offen, ragt der Dialog
# unten aus dem Bild, und "Speichern" liegt auf der Gestenleiste - der Tipp
# kommt nie an (erster Lauf, 2026-10-27).
#
# Nicht ueber hideKeyboard: Im zweiten Lauf hat Maestro die Tastatur (auf dem
# Emulator als schwebende Leiste) nicht erkannt, Zurueck gedrueckt und die
# Katalogpflege verlassen. Stattdessen wie in produkte.yaml ein Tipp auf eine
# Abteilungsueberschrift: nur Text, in beiden Zustaenden harmlos, und bei
# offener Tastatur schliesst die Liste sie (keyboardShouldPersistTaps).
- extendedWaitUntil:
    visible: 'Trockenwaren'
    timeout: 15000
- tapOn: 'Trockenwaren'
- waitForAnimationToEnd
# "product-Salz" trifft nur Salz, nicht Salzstangen - Maestro vergleicht die
# id als ganzen Ausdruck.
- extendedWaitUntil:
    visible:
      id: 'product-Salz'
    timeout: 15000
- tapOn:
    id: 'product-Salz'
- extendedWaitUntil:
    visible:
      id: 'product-staple'
    timeout: 15000
- assertVisible:
    id: 'product-staple'
    checked: true
- tapOn:
    id: 'product-staple'
- assertVisible:
    id: 'product-staple'
    checked: false
- tapOn:
    id: 'product-save'
- extendedWaitUntil:
    notVisible:
      id: 'product-staple'
    timeout: 15000

# Zurueck ueber den Pfeil der Kopfzeile (Label "Zurück", products.back) -
# nicht ueber die Systemtaste, die bei offener Tastatur nur diese schliesst.
- tapOn: 'Zurück'
- extendedWaitUntil:
    visible:
      id: 'list-Einkauf'
    timeout: 15000
- tapOn:
    id: 'lists-menu'
- extendedWaitUntil:
    visible:
      id: 'open-recipes'
    timeout: 15000
- tapOn:
    id: 'open-recipes'
- extendedWaitUntil:
    visible:
      id: 'recipes-list'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'recipe-Pfannkuchen'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'recipe-Pfannkuchen'
- extendedWaitUntil:
    visible:
      id: 'ingredient-Mehl'
    timeout: 15000
# Salz zaehlt jetzt mit: eins mehr als vorher.
- assertVisible:
    id: 'recipe-missing'
    text: '5 fehlen'
