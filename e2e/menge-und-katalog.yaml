# E2E fuer M4: der zweite Weg auf die Liste und die Detailzeile.
#
# Katalog oeffnen -> suchen -> mehrere Produkte ueber Kategorien hinweg
# auswaehlen -> uebernehmen -> nichts doppelt -> Menge, Einheit und Notiz
# aendern (PRD Flow 1.7 und 1.8, FR-2.3 bis FR-2.6).
#
# Laeuft gegen einen Release-Build (ADR-025): npm run android:release
# Zu den Zeitgrenzen siehe einkauf-abschliessen.yaml - die erste Interaktion
# nach clearState legt Kategorien und 200 Produkte an und braucht laenger.
appId: de.toshopping.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'add-input'
    timeout: 30000

# --- Katalog: Mehrfachauswahl ueber zwei Kategorien hinweg ---
- tapOn:
    id: 'open-catalog'
- extendedWaitUntil:
    visible:
      id: 'catalog-list'
    timeout: 15000

- tapOn:
    id: 'catalog-search'
- inputText: 'Milch'
- extendedWaitUntil:
    visible:
      id: 'catalog-Milch'
    timeout: 15000
- tapOn:
    id: 'catalog-Milch'

# Suche leeren und in einer anderen Kategorie weitersuchen. Die Auswahl aus
# der ersten Suche muss das ueberleben - genau das ist der Sinn der
# Mehrfachauswahl.
- tapOn:
    id: 'catalog-search'
- eraseText: 10
- inputText: 'Brot'
- extendedWaitUntil:
    visible:
      id: 'catalog-Brot'
    timeout: 15000
- tapOn:
    id: 'catalog-Brot'

- hideKeyboard
- assertVisible: '2 übernehmen'
- tapOn:
    id: 'catalog-apply'

# Beide Artikel stehen auf der Liste
- extendedWaitUntil:
    visible:
      id: 'item-Milch'
    timeout: 15000
- assertVisible:
    id: 'item-Brot'
- assertVisible: '2 von 2 offen'

# --- Nichts doppelt (T-4.4) ---
- tapOn:
    id: 'open-catalog'
- extendedWaitUntil:
    visible:
      id: 'catalog-list'
    timeout: 15000
- tapOn:
    id: 'catalog-search'
- inputText: 'Milch'
- extendedWaitUntil:
    visible:
      id: 'catalog-Milch'
    timeout: 15000
- assertVisible: 'Steht schon auf der Liste'
- hideKeyboard
- back

# --- Detailzeile: Menge, Einheit, Notiz ---
- extendedWaitUntil:
    visible:
      id: 'item-Milch'
    timeout: 15000
- tapOn:
    id: 'edit-Milch'
- extendedWaitUntil:
    visible:
      id: 'item-detail'
    timeout: 15000

# Zweimal Plus: 1 -> 3 Stueck. Die 1 wird nicht angezeigt (FR-2.6), ab 2 schon.
- tapOn:
    id: 'detail-plus'
- tapOn:
    id: 'detail-plus'
- extendedWaitUntil:
    visible: '3×'
    timeout: 15000

# Einheit wechseln - die Anzeige folgt sofort
- tapOn:
    id: 'unit-l'
- extendedWaitUntil:
    visible: '3 l'
    timeout: 15000

# Notiz eintragen (FR-2.5)
- tapOn:
    id: 'detail-note'
- inputText: 'laktosefrei'
- hideKeyboard
- tapOn:
    id: 'detail-done'

# Menge und Notiz stehen nach dem Schliessen in der Zeile
- extendedWaitUntil:
    visible: 'laktosefrei'
    timeout: 15000
- assertVisible: '3 l'

# Und sie ueberleben einen Neustart (FR-2.8, kein Speichern-Knopf)
- launchApp
- extendedWaitUntil:
    visible: 'laktosefrei'
    timeout: 30000
- assertVisible: '3 l'
