# E2E fuer M4: der zweite Weg auf die Liste und die Detailzeile.
#
# Katalog oeffnen -> suchen -> mehrere Produkte ueber Kategorien hinweg
# auswaehlen -> uebernehmen -> nichts doppelt -> Menge, Einheit und Notiz
# aendern (PRD Flow 1.7 und 1.8, FR-2.3 bis FR-2.6).
#
# Laeuft gegen einen Release-Build (ADR-025): npm run android:release
# Zu den Zeitgrenzen siehe einkauf-abschliessen.yaml - die erste Interaktion
# nach clearState legt Kategorien und 200 Produkte an und braucht laenger.
appId: de.toshopping.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'add-input'
    timeout: 30000

# --- Katalog: Mehrfachauswahl ueber zwei Kategorien hinweg ---
- tapOn:
    id: 'open-catalog'
- extendedWaitUntil:
    visible:
      id: 'catalog-list'
    timeout: 15000

- tapOn:
    id: 'catalog-search'
- inputText: 'Milch'
- extendedWaitUntil:
    visible:
      id: 'catalog-Milch'
    timeout: 15000
- tapOn:
    id: 'catalog-Milch'

# Suche leeren und in einer anderen Kategorie weitersuchen. Die Auswahl aus
# der ersten Suche muss das ueberleben - genau das ist der Sinn der
# Mehrfachauswahl.
- tapOn:
    id: 'catalog-search'
- eraseText: 10
- inputText: 'Brot'
- extendedWaitUntil:
    visible:
      id: 'catalog-Brot'
    timeout: 15000
- tapOn:
    id: 'catalog-Brot'

- hideKeyboard
- assertVisible: '2 übernehmen'
- tapOn:
    id: 'catalog-apply'

# Beide Artikel stehen auf der Liste
- extendedWaitUntil:
    visible:
      id: 'item-Milch'
    timeout: 15000
- assertVisible:
    id: 'item-Brot'
- assertVisible: '2 von 2 offen'

# --- Nichts doppelt (T-4.4) ---
- tapOn:
    id: 'open-catalog'
- extendedWaitUntil:
    visible:
      id: 'catalog-list'
    timeout: 15000
- tapOn:
    id: 'catalog-search'
- inputText: 'Milch'
- extendedWaitUntil:
    visible:
      id: 'catalog-Milch'
    timeout: 15000
# Geprueft wird der Zustand der Zeile, nicht ihr Text: Android fasst eine
# gesperrte Zeile zu einem Knoten zusammen, ihre Beschriftung taucht in der
# Ansichtshierarchie gar nicht mehr auf. "checked und nicht bedienbar" sagt
# ohnehin genauer, worum es geht - das Produkt ist schon auf der Liste.
- assertVisible:
    id: 'catalog-Milch'
    enabled: false
    checked: true
- hideKeyboard
- back

# --- Detailzeile: Menge, Einheit, Notiz ---
- extendedWaitUntil:
    visible:
      id: 'item-Milch'
    timeout: 15000
- tapOn:
    id: 'edit-Milch'
- extendedWaitUntil:
    visible:
      id: 'item-detail'
    timeout: 15000

# Milch kommt aus dem Katalog mit der Einheit Liter. Liter zaehlen in halben
# Schritten - ein Literschritt von 1 auf 2 waere beim Einkaufen zu grob, ein
# Milliliterschritt zu fein (QUANTITY_STEP).
- tapOn:
    id: 'detail-plus'
- extendedWaitUntil:
    visible: '1,5 l'
    timeout: 15000
- tapOn:
    id: 'detail-plus'
- extendedWaitUntil:
    visible: '2 l'
    timeout: 15000

# Einheit wechseln - die Anzeige folgt sofort
- tapOn:
    id: 'unit-kg'
- extendedWaitUntil:
    visible: '2 kg'
    timeout: 15000

# Notiz eintragen (FR-2.5)
- tapOn:
    id: 'detail-note'
- inputText: 'laktosefrei'
- hideKeyboard
- tapOn:
    id: 'detail-done'

# Menge und Notiz stehen nach dem Schliessen in der Zeile
- extendedWaitUntil:
    visible: 'laktosefrei'
    timeout: 15000
- assertVisible: '2 kg'

# Und sie ueberleben einen Neustart (FR-2.8, kein Speichern-Knopf)
- launchApp
- extendedWaitUntil:
    visible: 'laktosefrei'
    timeout: 30000
- assertVisible: '2 kg'
